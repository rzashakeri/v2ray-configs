name: Collect V2Ray configs

# Runs on a schedule and on demand. It does NOT trigger on push, so the
# commit it makes never starts another run (no infinite loop).
on:
  schedule:
    - cron: "*/30 * * * *" # every 30 minutes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect configs
        run: python3 collect.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add configs stats.json
          git diff --cached --quiet || git commit -m "chore: update configs [skip ci]"
          git push
